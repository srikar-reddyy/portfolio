  <rect x="392" y="170" width="192" height="174" rx="10" fill="#132a45"/>
  <text x="406" y="192" font-family="Inter,Arial,sans-serif" font-size="11" fill="#94a3b8">Weekly attendance</text>
  <g fill="url(#bar)">
    <rect x="410" y="250" width="18" height="78" rx="3"/><rect x="434" y="230" width="18" height="98" rx="3"/><rect x="458" y="240" width="18" height="88" rx="3"/><rect x="482" y="215" width="18" height="113" rx="3"/><rect x="506" y="226" width="18" height="102" rx="3"/><rect x="530" y="208" width="18" height="120" rx="3"/><rect x="554" y="236" width="18" height="92" rx="3"/>
  </g>
