<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1a2e"/><stop offset="1" stop-color="#071019"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="560" cy="60" r="120" fill="#22d3ee" opacity=".08"/>
  <!-- dashboard window -->
  <rect x="40" y="40" width="560" height="320" rx="16" fill="#0f2238" stroke="#1e3a5f"/>
  <rect x="40" y="40" width="560" height="36" rx="16" fill="#132a45"/>
  <rect x="40" y="60" width="560" height="16" fill="#132a45"/>
  <circle cx="64" cy="58" r="5" fill="#f87171"/><circle cx="82" cy="58" r="5" fill="#fbbf24"/><circle cx="100" cy="58" r="5" fill="#34d399"/>
  <text x="128" y="63" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">StaySync</text>
  <text x="196" y="63" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b">· Hostel Dashboard</text>
  <!-- sidebar -->
  <rect x="56" y="92" width="110" height="252" rx="10" fill="#0b1a2e"/>
  <g font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">
    <rect x="66" y="104" width="90" height="26" rx="6" fill="#22d3ee" opacity=".15"/>
    <text x="78" y="121" fill="#22d3ee">Rooms</text>
    <text x="78" y="155">Outpasses</text>
    <text x="78" y="185">Attendance</text>
    <text x="78" y="215">Residents</text>
  </g>
  <!-- stat cards -->
  <g font-family="Inter,Arial,sans-serif">
    <rect x="180" y="92" width="128" height="64" rx="10" fill="#132a45"/>
    <text x="194" y="116" font-size="11" fill="#94a3b8">Active users</text>
    <text x="194" y="143" font-size="22" font-weight="800" fill="#e2e8f0">2,400+</text>
    <rect x="320" y="92" width="128" height="64" rx="10" fill="#132a45"/>
    <text x="334" y="116" font-size="11" fill="#94a3b8">Uptime</text>
    <text x="334" y="143" font-size="22" font-weight="800" fill="#34d399">99.9%</text>
    <rect x="460" y="92" width="124" height="64" rx="10" fill="#132a45"/>
    <text x="474" y="116" font-size="11" fill="#94a3b8">Occupancy</text>
    <text x="474" y="143" font-size="22" font-weight="800" fill="#22d3ee">92%</text>
  </g>
  <!-- room grid -->
  <g>
    <rect x="180" y="170" width="200" height="174" rx="10" fill="#132a45"/>
    <text x="194" y="192" font-family="Inter,Arial,sans-serif" font-size="11" fill="#94a3b8">Room allocation</text>
    <g fill="#22d3ee">
      <rect x="194" y="204" width="30" height="26" rx="4"/><rect x="230" y="204" width="30" height="26" rx="4"/><rect x="266" y="204" width="30" height="26" rx="4" opacity=".25"/><rect x="302" y="204" width="30" height="26" rx="4"/><rect x="338" y="204" width="30" height="26" rx="4"/>
      <rect x="194" y="236" width="30" height="26" rx="4" opacity=".25"/><rect x="230" y="236" width="30" height="26" rx="4"/><rect x="266" y="236" width="30" height="26" rx="4"/><rect x="302" y="236" width="30" height="26" rx="4"/><rect x="338" y="236" width="30" height="26" rx="4" opacity=".25"/>
      <rect x="194" y="268" width="30" height="26" rx="4"/><rect x="230" y="268" width="30" height="26" rx="4"/><rect x="266" y="268" width="30" height="26" rx="4"/><rect x="302" y="268" width="30" height="26" rx="4" opacity=".25"/><rect x="338" y="268" width="30" height="26" rx="4"/>
      <rect x="194" y="300" width="30" height="26" rx="4"/><rect x="230" y="300" width="30" height="26" rx="4" opacity=".25"/><rect x="266" y="300" width="30" height="26" rx="4"/><rect x="302" y="300" width="30" height="26" rx="4"/><rect x="338" y="300" width="30" height="26" rx="4"/>
    </g>
